name: Build CV PDFs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: make install-local-deps

      - name: Build all CVs
        run: make cv-all INCLUDE_SUMMARY=1

      - name: Build all cover letters
        run: make cover-letter-all

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdf/
          if-no-files-found: error

      - name: Commit updated PDFs
        run: |
          if [ -n "$(git status --porcelain pdf/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pdf/
            git commit -m "chore: update generated PDFs [skip ci]"
            branch="${GITHUB_REF#refs/heads/}"
            git push origin "HEAD:${branch}"
          else
            echo "No PDF changes to commit."
          fi